<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>차량 주유·요소수 기록</title>
<meta name="theme-color" content="#0f6b4f">
<style>
  :root { --bg:#f3f5f4; --card:#fff; --fg:#18211f; --muted:#5d6b67; --line:#d9e0dd; --accent:#0f6b4f; --chip:#e3eeea; --err:#b3261e; --amber:#b86e00; --blue:#245b92; }
  * { box-sizing:border-box } [hidden] { display:none!important }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; font-size:16px; line-height:1.5 }
  .wrap { max-width:540px; margin:0 auto; padding:18px 16px 40px; display:grid; gap:14px }
  h1 { font-size:1.3rem; margin:0 } h1 small { font-size:.7rem; color:var(--accent); border:1.5px solid var(--accent); border-radius:4px; padding:0 5px; margin-left:6px; vertical-align:3px; letter-spacing:.08em }
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); background:var(--chip); border-radius:10px; padding:4px; gap:4px }
  .tabs button { border:0; background:transparent; color:var(--muted); font:inherit; font-size:.9rem; font-weight:bold; padding:10px 4px; border-radius:7px; cursor:pointer }
  .tabs button.on { background:var(--card); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.08) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; gap:13px }
  .stack { display:grid; gap:10px } label { display:grid; gap:4px; font-size:.86rem; font-weight:bold; color:var(--muted) } .req { color:var(--err) }
  input, select { font:inherit; font-size:1rem; color:var(--fg); background:var(--bg); border:1.5px solid var(--line); border-radius:8px; padding:11px 12px; width:100%; min-width:0 }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px } .big { font-size:1.55rem; font-weight:bold; padding:9px 12px; letter-spacing:.03em }
  .unit { position:relative } .unit input { padding-right:52px } .unit span { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:bold }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px }
  .car { border:1.5px solid var(--accent); background:#eef6f2; border-radius:9px; padding:10px 12px; display:grid; gap:2px }
  .car b { font-size:1.15rem } .car span { font-size:.85rem; color:var(--muted) } .car.none { border-color:var(--line); background:var(--bg) } .car.none b { font-size:.95rem; color:var(--muted); font-weight:normal }
  .mode-note { border-left:4px solid var(--blue); background:#edf5fd; padding:9px 12px; border-radius:6px; font-size:.88rem; color:#173f68 }
  .mode-note.urea { border-left-color:#48768c; background:#edf6f8; color:#214653 }
  .mode-note.tank { border-left-color:var(--amber); background:#fff6e8; color:#6b4300 }
  .calc { background:#f7f8f7; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:.9rem; color:var(--muted) }
  button.save { font:inherit; font-weight:bold; font-size:1.1rem; border:0; border-radius:10px; padding:15px; background:var(--accent); color:#fff; cursor:pointer }
  button.save.external { background:var(--blue) } button.save.urea { background:#48768c } button.save.tank { background:var(--amber) } button.save:disabled { opacity:.5 }
  .msg { min-height:1.4em; font-size:.95rem } .ok { color:var(--accent); font-weight:bold } .bad { color:var(--err) }
  h2 { font-size:.95rem; margin:0 } table { width:100%; border-collapse:collapse; font-size:.88rem } th,td { padding:7px 5px; border-bottom:1px solid var(--line); text-align:left } th { color:var(--muted); font-weight:normal; font-size:.76rem } td.n,th.n { text-align:right; font-variant-numeric:tabular-nums }
  .note { font-size:.8rem; color:var(--muted); margin:0 } .locked .tabs,.locked #f,.locked #recentBox { display:none!important }
  @media (max-width:380px) { .row { grid-template-columns:1fr } .tabs button { font-size:.76rem; padding-left:2px; padding-right:2px } }
</style>
</head>
<body>
<div class="wrap">
  <h1>차량 주유·요소수 기록 <small>FUEL</small></h1>

  <form class="card" id="pinBox" hidden novalidate>
    <label>회사 PIN<input id="pin" class="big" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••"></label>
    <button class="save" type="submit">확인</button><div class="msg bad" id="pinMsg" role="status"></div>
    <p class="note">처음 한 번만 입력하면 이 휴대폰에 기억됩니다.</p>
  </form>

  <div class="tabs">
    <button id="tFuel" class="on" type="button">사내 경유</button>
    <button id="tExternal" type="button">외부주유</button>
    <button id="tUrea" type="button">요소수</button>
    <button id="tTank" type="button">탱크 입고</button>
  </div>

  <form class="card" id="f" novalidate>
    <div class="mode-note" id="externalNote" hidden>외부 주유소에서 넣은 <b>휘발유·LPG</b> 내역을 입력합니다. 영수증의 주유량과 결제금액을 적어 주세요.</div>
    <div class="mode-note urea" id="ureaNote" hidden>차량에 보충한 <b>요소수 사용량</b>을 입력합니다. 현재 단가로 금액이 자동 계산됩니다.</div>
    <div class="mode-note tank" id="tankNote" hidden>탱크로리로 회사 탱크에 경유를 채웠을 때 입력합니다.</div>

    <div id="carBox" class="stack">
      <label>차량번호 뒤 4자리 <span class="req">*</span><input id="last4" class="big" inputmode="numeric" maxlength="4" placeholder="예: 1623" autocomplete="off"></label>
      <div class="car none" id="carCard"><b>4자리를 넣으면 차량이 표시됩니다</b></div>
      <label>또는 목록에서 고르기<select id="plateSel"><option value="">차량 목록 불러오는 중…</option></select></label>
    </div>

    <div id="externalFields" class="stack" hidden>
      <div class="row">
        <label>유종 <span class="req">*</span><select id="fuelType"><option value="휘발유">휘발유</option><option value="LPG">LPG</option></select></label>
        <label>주유소 (선택)<input id="station" placeholder="예: OO주유소"></label>
      </div>
      <div class="row">
        <label>주유량 <span class="req">*</span><div class="unit"><input id="externalLiters" class="big" type="number" inputmode="decimal" step="0.001" min="0" placeholder="0"><span>L</span></div></label>
        <label>결제금액 <span class="req">*</span><div class="unit"><input id="amount" class="big" type="number" inputmode="numeric" step="1" min="0" placeholder="0"><span>원</span></div></label>
      </div>
      <div class="calc" id="unitPrice">계산 단가: -</div>
    </div>

    <div id="dieselAmount">
      <label><span id="amtLabel">주유량</span> <span class="req">*</span><div class="unit"><input id="liters" class="big" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0"><span>L</span></div></label>
    </div>
    <div class="row"><label>날짜 <input id="date" type="date"></label><label>메모 (선택)<input id="memo" placeholder="예: 영수증 보관"></label></div>
    <button class="save" id="save" type="submit">저장</button><div class="msg" id="msg" role="status"></div>
    <p class="note" id="memoryNote">마지막으로 넣은 차량은 이 휴대폰에 기억됩니다.</p>
  </form>

  <div class="card" id="recentBox" hidden><h2 id="recentTitle">최근 기록</h2><table><thead id="recentHead"></thead><tbody id="recent"></tbody></table></div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const mem = { get(k){ try{return localStorage.getItem(k)||''}catch(e){return''} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };
  const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10) };
  const API = 'https://script.google.com/macros/s/AKfycbwSmMlWCC4rc_VZNed83Ouei5AVYk99wvIJAqFgOEG45hRZh0td0DEhJKbNjTnnX_DFAg/exec';
  let cars=[], current=null, mode='fuel', PIN=mem.get('fuel.pin'); $('date').value=today();
  const apiGet=q=>fetch(API+'?'+new URLSearchParams(Object.assign({pin:PIN},q)),{credentials:'omit'}).then(r=>r.json());
  const apiPost=d=>fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({pin:PIN},d))}).then(r=>r.json());

  function isExternalCar(c){ return /LPG|가솔린/i.test(c.model||'') }
  function guessedFuel(c){ return /LPG/i.test((c&&c.model)||'')?'LPG':'휘발유' }
  function visibleCars(){ return mode==='external'?cars.filter(isExternalCar):mode==='urea'?cars.filter(c=>!isExternalCar(c)):cars }
  function setMode(m){
    mode=m; current=null; $('last4').value='';
    ['Fuel','External','Urea','Tank'].forEach(x=>$('t'+x).classList.toggle('on',m===x.toLowerCase()));
    $('carBox').hidden=m==='tank'; $('externalNote').hidden=m!=='external'; $('ureaNote').hidden=m!=='urea'; $('tankNote').hidden=m!=='tank';
    $('externalFields').hidden=m!=='external'; $('dieselAmount').hidden=m==='external';
    $('save').className='save'+(m==='external'?' external':m==='urea'?' urea':m==='tank'?' tank':'');
    $('save').textContent=m==='external'?'외부주유 저장':m==='urea'?'요소수 저장':m==='tank'?'탱크 입고 저장':'저장';
    $('amtLabel').textContent=m==='tank'?'입고량':m==='urea'?'요소수 사용량':'주유량'; $('memoryNote').hidden=m==='tank'; $('msg').textContent=''; $('recentBox').hidden=true;
    renderCarOptions(); pick(null);
    const memoryKey=m==='external'?'fuel.externalPlate':m==='urea'?'fuel.ureaPlate':'fuel.plate';
    const saved=visibleCars().find(c=>c.plate===mem.get(memoryKey)); if(saved) pick(saved);
  }
  $('tFuel').onclick=()=>setMode('fuel'); $('tExternal').onclick=()=>setMode('external'); $('tUrea').onclick=()=>setMode('urea'); $('tTank').onclick=()=>setMode('tank');

  function renderCarOptions(){
    const sel=$('plateSel'); sel.innerHTML=''; sel.add(new Option(mode==='external'?'휘발유·LPG 차량을 고르세요':mode==='urea'?'요소수 사용 차량을 고르세요':'차량을 고르세요',''));
    const groups={}; visibleCars().forEach(c=>{const g=c.company+(c.kind==='개인'?' · 개인차량':' · '+c.dept);(groups[g]=groups[g]||[]).push(c)});
    Object.keys(groups).forEach(g=>{const og=document.createElement('optgroup');og.label=g;groups[g].forEach(c=>og.appendChild(new Option(c.plate+'  '+[c.model,c.driver].filter(Boolean).join(' · '),c.plate)));sel.appendChild(og)});
  }
  function pick(car){
    current=car||null; const card=$('carCard');
    if(!car){card.className='car none';card.innerHTML='<b>4자리를 넣으면 차량이 표시됩니다</b>'; $('recentBox').hidden=true; return}
    card.className='car';card.innerHTML='<b></b><span></span>';card.children[0].textContent=car.plate;card.children[1].textContent=[car.model,car.driver,car.company+' '+car.dept].filter(Boolean).join(' · ');
    $('plateSel').value=car.plate;if($('last4').value!==car.plate.slice(-4))$('last4').value=car.plate.slice(-4);if(mode==='external')$('fuelType').value=guessedFuel(car);loadRecent(car.plate);
  }
  $('last4').addEventListener('input',()=>{const v=$('last4').value.replace(/\D/g,'').slice(0,4);$('last4').value=v;if(v.length<4){if(current&&current.plate.slice(-4)!==v)pick(null);return}const hit=visibleCars().filter(c=>c.plate.slice(-4)===v);if(hit.length===1)pick(hit[0]);else{pick(null);$('carCard').firstChild.textContent=hit.length?'같은 4자리 차량이 여러 대입니다. 목록에서 골라 주세요.':'대상 차량이 아닙니다. 번호를 확인해 주세요.'}});
  $('plateSel').onchange=()=>pick(cars.find(c=>c.plate===$('plateSel').value));
  function updateUnit(){const l=Number($('externalLiters').value),a=Number($('amount').value);$('unitPrice').textContent=l>0&&a>0?'계산 단가: '+Math.round(a/l).toLocaleString('ko-KR')+'원/L':'계산 단가: -'}
  $('externalLiters').oninput=updateUnit; $('amount').oninput=updateUnit;

  function needPin(text){mem.set('fuel.pin','');document.body.classList.add('locked');$('pinBox').hidden=false;$('pinMsg').textContent=text||'';$('pin').value='';$('pin').focus()}
  $('pinBox').addEventListener('submit',e=>{e.preventDefault();PIN=$('pin').value.trim();if(!PIN){$('pinMsg').textContent='PIN을 입력해 주세요.';return}$('pinMsg').textContent='확인 중…';loadCars()});
  function loadCars(){apiGet({api:'vehicles'}).then(list=>{if(!Array.isArray(list)){needPin(PIN?'PIN이 맞지 않습니다. 다시 입력해 주세요.':'');return}mem.set('fuel.pin',PIN);document.body.classList.remove('locked');$('pinBox').hidden=true;cars=list||[];setMode(mode)}).catch(()=>{$('pinMsg').textContent='연결하지 못했습니다. 인터넷을 확인해 주세요.'})}
  if(PIN) loadCars(); else needPin('');

  function loadRecent(plate){apiGet({api:'recent',plate,mode:mode==='external'?'external':mode==='urea'?'urea':'fuel'}).then(rows=>showRecent(plate,rows)).catch(()=>{})}
  function showRecent(plate,rows){
    const tb=$('recent');tb.innerHTML='';$('recentTitle').textContent=plate+' 최근 기록';
    if(!rows||!rows.length||mode==='tank'){$('recentBox').hidden=true;return}
    $('recentHead').innerHTML=mode==='external'?'<tr><th>날짜</th><th>유종</th><th class="n">주유량</th><th class="n">금액</th></tr>':'<tr><th>날짜</th><th class="n">주유량</th><th>메모</th></tr>';
    rows.forEach(r=>{const tr=document.createElement('tr');const vals=mode==='external'?[r.date,r.fuelType,r.liters+' L',Number(r.amount||0).toLocaleString('ko-KR')+'원']:[r.date,r.liters+' L',r.memo||''];vals.forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if((mode==='external'&&i>1)||(mode!=='external'&&i===1))td.className='n';tr.appendChild(td)});tb.appendChild(tr)});$('recentBox').hidden=false;
  }
  $('f').addEventListener('submit',e=>{
    e.preventDefault();const msg=$('msg');if(mode!=='tank'&&!current){msg.className='msg bad';msg.textContent='차량을 먼저 골라 주세요.';return}
    let d={mode,plate:current?current.plate:'',date:$('date').value,memo:$('memo').value.trim()};
    if(mode==='external'){d.fuelType=$('fuelType').value;d.liters=Number($('externalLiters').value);d.amount=Math.round(Number($('amount').value));d.station=$('station').value.trim();if(!(d.liters>0)){msg.className='msg bad';msg.textContent='주유량을 넣어 주세요.';return}if(!(d.amount>0)){msg.className='msg bad';msg.textContent='결제금액을 넣어 주세요.';return}if(d.liters>500){msg.className='msg bad';msg.textContent='주유량이 500L를 넘습니다. 숫자를 확인해 주세요.';return}}
    else{d.liters=Number($('liters').value);if(!(d.liters>0)){msg.className='msg bad';msg.textContent=(mode==='tank'?'입고량':mode==='urea'?'요소수 사용량':'주유량')+'을 넣어 주세요.';return}if((mode==='fuel'||mode==='urea')&&d.liters>500){msg.className='msg bad';msg.textContent=(mode==='urea'?'요소수 사용량':'주유량')+'이 500L를 넘습니다. 숫자를 확인해 주세요.';return}}
    $('save').disabled=true;msg.className='msg';msg.textContent='저장 중…';
    apiPost(d).then(res=>{if(res&&res.error==='pin'){needPin('PIN이 바뀌었습니다. 새 PIN을 입력해 주세요.');return}if(!res||!res.ok)throw new Error(res&&res.error);
      msg.className='msg ok';if(mode==='tank')msg.textContent='탱크 입고 저장: '+d.liters.toLocaleString('ko-KR')+'L';else if(mode==='external'){mem.set('fuel.externalPlate',d.plate);msg.textContent='외부주유 저장: '+d.plate+' · '+d.liters+'L · '+d.amount.toLocaleString('ko-KR')+'원';showRecent(d.plate,res.rows)}else if(mode==='urea'){mem.set('fuel.ureaPlate',d.plate);msg.textContent='요소수 저장: '+d.plate+' · '+d.liters+'L';showRecent(d.plate,res.rows)}else{mem.set('fuel.plate',d.plate);msg.textContent='저장했습니다: '+d.plate+' · '+d.liters+'L';showRecent(d.plate,res.rows)}
      $('liters').value='';$('externalLiters').value='';$('amount').value='';$('station').value='';$('memo').value='';updateUnit();
    }).catch(err=>{msg.className='msg bad';msg.textContent=(err&&err.message)||'저장하지 못했습니다. 인터넷 연결을 확인해 주세요.'}).finally(()=>{$('save').disabled=false});
  });
</script>
</body>
</html>
